server:
  port: 8082

spring:
  application:
    name: order-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nanugi}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

jwt:
  secret: ${JWT_SECRET}

kafka:
  topic:
    group-buy-payment-request: group-buy.payment.request
    group-buy-shipping-started: group-buy.shipping.started
    group-buy-shipping-info-complete: group-buy.shipping-info.complete
    group-buy-delivery-complete: group-buy.delivery.complete

delivery:
  tracking:
    api-key: ${DELIVERY_TRACKING_API_KEY:}
    api-url: https://info.sweettracker.co.kr/api/v1/trackingInfo

app:
  base-url: ${APP_BASE_URL:http://localhost:3000}

# GroupBuyParticipant.billingKey의 @Convert(BillingKeyConverter)를 Hibernate가
# 이 서비스에서도 생성하므로(com.payment.common까지 스캔) 동일 키가 필요하다.
# 운영 환경에서는 반드시 BILLING_KEY_SECRET 환경변수로 교체해야 한다.
billing-key:
  encryption-secret: ${BILLING_KEY_SECRET:HUdw66JrU4YhvEgan587L6JJl9tYYAu4LwYqygyUncQ=}

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
    product-service:
      url: ${PRODUCT_SERVICE_URL:http://localhost:8083}
    payment-service:
      url: ${PAYMENT_SERVICE_URL:http://localhost:8081}
