server:
  port: 8081

spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DATABASE_URL}
    username: ${PAYMENT_DATABASE_USERNAME}
    password: ${PAYMENT_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${PAYMENT_REDIS_HOST}
      port: ${PAYMENT_REDIS_PORT}
  kafka:
    bootstrap-servers: ${PAYMENT_KAFKA_BOOTSTRAP_SERVERS}
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

jwt:
  secret: ${JWT_SECRET}

kafka:
  topic:
    settlement-notification: settlement.notification
    settlement-reminder: settlement.reminder
    group-buy-payment-success: group-buy.payment.success
    group-buy-payment-failed: group-buy.payment.failed
    group-buy-delivery-complete: group-buy.delivery.complete
    group-buy-shipping-started: group-buy.shipping.started
    group-buy-shipping-info-complete: group-buy.shipping-info.complete
  producer:
    retries: 3
    retry-backoff-ms: 1000
    request-timeout-ms: 30000
    delivery-timeout-ms: 120000
    send-timeout-seconds: 30
    max-outbox-retries: 5

delivery:
  tracking:
    api-key: ${DELIVERY_TRACKING_API_KEY:}
    api-url: https://info.sweettracker.co.kr/api/v1/trackingInfo

app:
  base-url: ${APP_BASE_URL:http://localhost:3000}

crawler:
  python:
    path: ${PYTHON_PATH:python3}
  timeout-seconds: 30

notification:
  retry:
    interval-ms: 60000

payment:
  outbox:
    relay-interval-ms: 5000
  encryption:
    key: ${PAYMENT_ENCRYPTION_KEY}

ocr:
  kakao:
    app-key: ${OCR_KAKAO_APP_KEY:}
