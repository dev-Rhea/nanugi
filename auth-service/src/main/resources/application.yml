server:
  port: 8080

spring:
  datasource:
    url: ${DATABASE_URL:postgres}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  redirect-uri: ${KAKAO_REDIRECT_URI}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000 # 1 hour
  refresh-token-expiration: 604800000 # 7 days

# GroupBuyParticipant.billingKey의 @Convert(BillingKeyConverter)를 Hibernate가
# 이 서비스에서도 생성하므로(EntityScan이 com.payment 전체를 포함) 동일 키가 필요하다.
# 키는 BILLING_KEY_SECRET 환경변수로만 받는다. 기본값을 두지 않아, 없으면 기동이 실패한다.
billing-key:
  encryption-secret: ${BILLING_KEY_SECRET}